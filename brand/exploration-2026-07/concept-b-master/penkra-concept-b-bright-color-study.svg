<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1040" role="img" aria-labelledby="title desc">
  <title id="title">Bright Penkra logo color study</title>
  <desc id="desc">Eight brighter and more diverse color directions for the selected Penkra P symbol.</desc>

  <rect width="1760" height="1040" fill="#F5F3EE"/>
  <text x="64" y="68" fill="#172139" font-family="Arial, sans-serif" font-size="34" font-weight="700">Brighter Penkra color directions</text>
  <text x="64" y="101" fill="#172139" fill-opacity=".68" font-family="Arial, sans-serif" font-size="16">The geometry is locked. Each direction pairs a saturated primary with a bright bridge accent.</text>

  <!-- 01 Cobalt + Cyan -->
  <g transform="translate(64 144)">
    <rect width="376" height="360" rx="28" fill="#F2F7FF"/>
    <g transform="translate(101 23) scale(.34)">
      <path fill="#1746D1" d="M89 278v-67C89 119.3 163.3 45 255 45c92.2 0 167 74.3 167 166 0 88.5-70.3 160.8-158.2 163H260v-71c50.8 0 92-41.2 92-92 0-52.5-42.5-95-95-95-54.7 0-99 43.1-99 95v67H89Z"/>
      <rect x="89" y="303" width="69" height="164" fill="#1746D1"/>
      <rect x="182" y="303" width="78" height="71" fill="#51D6FF"/>
    </g>
    <text x="30" y="282" fill="#1746D1" font-family="Arial, sans-serif" font-size="21" font-weight="700">01  Cobalt &amp; Cyan</text>
    <text x="30" y="314" fill="#1746D1" fill-opacity=".7" font-family="Arial, sans-serif" font-size="15">#1746D1 · #51D6FF</text>
  </g>

  <!-- 02 Violet + Coral -->
  <g transform="translate(480 144)">
    <rect width="376" height="360" rx="28" fill="#FAF6FF"/>
    <g transform="translate(101 23) scale(.34)">
      <path fill="#6536D6" d="M89 278v-67C89 119.3 163.3 45 255 45c92.2 0 167 74.3 167 166 0 88.5-70.3 160.8-158.2 163H260v-71c50.8 0 92-41.2 92-92 0-52.5-42.5-95-95-95-54.7 0-99 43.1-99 95v67H89Z"/>
