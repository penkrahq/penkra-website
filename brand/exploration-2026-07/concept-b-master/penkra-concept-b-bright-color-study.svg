    <rect width="376" height="360" rx="28" fill="#FFF4FC"/>
    <g transform="translate(101 23) scale(.34)">
      <path fill="#B526A9" d="M89 278v-67C89 119.3 163.3 45 255 45c92.2 0 167 74.3 167 166 0 88.5-70.3 160.8-158.2 163H260v-71c50.8 0 92-41.2 92-92 0-52.5-42.5-95-95-95-54.7 0-99 43.1-99 95v67H89Z"/>
