services:
  penkra-com:
    container_name: penkra-com
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - VIRTUAL_HOST=penkra.com,www.penkra.com
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=penkra.com,www.penkra.com
      - LETSENCRYPT_EMAIL=emmanuel@penkra.com
    expose:
      - "3000"
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
