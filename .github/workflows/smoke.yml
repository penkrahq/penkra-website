name: Smoke

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = "https://penkra.com";

          async function get(path) {
            const response = await fetch(`${baseUrl}${path}`, {
              headers: { accept: path.endsWith(".webmanifest") ? "application/manifest+json" : "*/*" },
            });
            if (!response.ok) {
              throw new Error(`${path} returned HTTP ${response.status}`);
            }
            return response;
          }

          const [home, sitemap, robots, manifest, macosArm64, macosX64, latestRelease] = await Promise.all([
            get("/"),
            get("/sitemap.xml"),
            get("/robots.txt"),
            get("/manifest.webmanifest"),
            fetch(`${baseUrl}/download/macos?arch=arm64`, { redirect: "manual" }),
            fetch(`${baseUrl}/download/macos?arch=x64`, { redirect: "manual" }),
            fetch("https://api.github.com/repos/penkrahq/penkra/releases/latest", {
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                "user-agent": "penkra.com-smoke",
                "x-github-api-version": "2022-11-28",
              },
            }),
          ]);

          const [homeText, sitemapText, robotsText, manifestJson] = await Promise.all([
            home.text(),
            sitemap.text(),
            robots.text(),
            manifest.json(),
          ]);

          if (!homeText.includes("Penkra")) {
            throw new Error("Home page did not include Penkra");
          }
          if (!sitemapText.includes("https://penkra.com")) {
            throw new Error("Sitemap did not include https://penkra.com");
          }
          if (!robotsText.includes("Sitemap: https://penkra.com/sitemap.xml")) {
            throw new Error("robots.txt did not reference the sitemap");
          }
          if (manifestJson.name !== "Penkra") {
            throw new Error(`Unexpected manifest name: ${manifestJson.name}`);
          }

          if (macosArm64.status !== 307 || macosX64.status !== 307 || !latestRelease.ok) {
            throw new Error(
              `Download verification failed: arm64=${macosArm64.status} x64=${macosX64.status} release=${latestRelease.status}`,
            );
          }
          const releaseJson = await latestRelease.json();
          const arm64Redirect = macosArm64.headers.get("location");
          const x64Redirect = macosX64.headers.get("location");
          const releaseAssets = Array.isArray(releaseJson.assets) ? releaseJson.assets : [];
          const arm64AssetUrls = releaseAssets
            .filter((asset) => /arm64.*\.dmg$/i.test(asset.name))
            .map((asset) => asset.browser_download_url);
          const x64AssetUrls = releaseAssets
            .filter((asset) => /x64.*\.dmg$/i.test(asset.name))
            .map((asset) => asset.browser_download_url);
          if (
            !arm64Redirect ||
            !arm64AssetUrls.includes(arm64Redirect) ||
            !x64Redirect ||
            !x64AssetUrls.includes(x64Redirect)
          ) {
            throw new Error(
              `macOS downloads are not from latest release ${releaseJson.tag_name}: arm64=${arm64Redirect} x64=${x64Redirect}`,
            );
          }

          console.log(`Public website smoke passed for https://penkra.com (${releaseJson.tag_name})`);
          NODE
