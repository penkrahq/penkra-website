name: Smoke

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public website
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = "https://penkra.com";

          async function get(path) {
            const response = await fetch(`${baseUrl}${path}`, {
              headers: { accept: path.endsWith(".webmanifest") ? "application/manifest+json" : "*/*" },
            });
            if (!response.ok) {
              throw new Error(`${path} returned HTTP ${response.status}`);
            }
            return response;
          }

          const [home, sitemap, robots, manifest, macosDownload, latestRelease] = await Promise.all([
            get("/"),
            get("/sitemap.xml"),
            get("/robots.txt"),
            get("/manifest.webmanifest"),
            fetch(`${baseUrl}/download/macos`, { redirect: "manual" }),
            fetch("https://api.github.com/repos/penkrahq/penkra/releases/latest", {
              headers: {
                accept: "application/vnd.github+json",
                "user-agent": "penkra.com-smoke",
                "x-github-api-version": "2022-11-28",
              },
            }),
          ]);

          const [homeText, sitemapText, robotsText, manifestJson] = await Promise.all([
            home.text(),
            sitemap.text(),
            robots.text(),
            manifest.json(),
          ]);

          if (!homeText.includes("Penkra")) {
            throw new Error("Home page did not include Penkra");
          }
          if (!sitemapText.includes("https://penkra.com")) {
            throw new Error("Sitemap did not include https://penkra.com");
          }
          if (!robotsText.includes("Sitemap: https://penkra.com/sitemap.xml")) {
            throw new Error("robots.txt did not reference the sitemap");
          }
          if (manifestJson.name !== "Penkra") {
            throw new Error(`Unexpected manifest name: ${manifestJson.name}`);
          }

          if (macosDownload.status !== 307 || !latestRelease.ok) {
            throw new Error(
              `Download verification failed: redirect=${macosDownload.status} release=${latestRelease.status}`,
            );
          }
          const releaseJson = await latestRelease.json();
          const redirectLocation = macosDownload.headers.get("location");
          const macosAssetUrls = Array.isArray(releaseJson.assets)
            ? releaseJson.assets
                .filter((asset) => /arm64.*\.dmg$/i.test(asset.name))
                .map((asset) => asset.browser_download_url)
            : [];
          if (!redirectLocation || !macosAssetUrls.includes(redirectLocation)) {
            throw new Error(
              `macOS download is not from latest release ${releaseJson.tag_name}: ${redirectLocation}`,
            );
          }

          console.log(`Public website smoke passed for https://penkra.com (${releaseJson.tag_name})`);
          NODE
