name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: penkra-com-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, penkra, website]
    environment:
      name: production
      url: https://penkra.com
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Deploy with Docker Compose
        env:
          COMPOSE_BAKE: "true"
          COMPOSE_PROJECT_NAME: penkra-com
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" build
          docker compose -p "$COMPOSE_PROJECT_NAME" up --force-recreate --remove-orphans -d
          sleep 5
          docker compose -p "$COMPOSE_PROJECT_NAME" ps
          docker compose -p "$COMPOSE_PROJECT_NAME" logs --no-color --tail=120 penkra-com

          CONTAINER_ID="$(docker compose -p "$COMPOSE_PROJECT_NAME" ps -q penkra-com)"
          if [ -z "$CONTAINER_ID" ] || [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID")" != "true" ]; then
            echo "penkra.com container is not running after deploy"
            exit 1
          fi

          docker compose -p "$COMPOSE_PROJECT_NAME" exec -T penkra-com node --input-type=module <<'NODE'
          const deadline = Date.now() + 60_000;
          let lastError;
          while (Date.now() < deadline) {
            try {
              const [home, sitemap, robots, manifest, macosDownload, latestRelease] = await Promise.all([
                fetch("http://127.0.0.1:3000/"),
                fetch("http://127.0.0.1:3000/sitemap.xml"),
                fetch("http://127.0.0.1:3000/robots.txt"),
                fetch("http://127.0.0.1:3000/manifest.webmanifest"),
                fetch("http://127.0.0.1:3000/download/macos", { redirect: "manual" }),
                fetch("https://api.github.com/repos/penkrahq/penkra/releases/latest", {
                  headers: {
                    accept: "application/vnd.github+json",
                    "user-agent": "penkra.com-deploy",
                    "x-github-api-version": "2022-11-28",
                  },
                }),
              ]);

              if (
                !home.ok ||
                !sitemap.ok ||
                !robots.ok ||
                !manifest.ok ||
                macosDownload.status !== 307 ||
                !latestRelease.ok
              ) {
                throw new Error(
                  `home=${home.status} sitemap=${sitemap.status} robots=${robots.status} manifest=${manifest.status} macos=${macosDownload.status} release=${latestRelease.status}`,
                );
              }

              const [homeText, sitemapText, robotsText, manifestJson, releaseJson] = await Promise.all([
                home.text(),
                sitemap.text(),
                robots.text(),
                manifest.json(),
                latestRelease.json(),
              ]);
              const redirectLocation = macosDownload.headers.get("location");
              const macosAssetUrls = Array.isArray(releaseJson.assets)
                ? releaseJson.assets
                    .filter((asset) => /arm64.*\.dmg$/i.test(asset.name))
                    .map((asset) => asset.browser_download_url)
                : [];

              if (
                homeText.includes("Penkra") &&
                sitemapText.includes("https://penkra.com") &&
                robotsText.includes("Sitemap: https://penkra.com/sitemap.xml") &&
                manifestJson.name === "Penkra" &&
                redirectLocation &&
                macosAssetUrls.includes(redirectLocation)
              ) {
                console.log(`penkra.com health check passed (${releaseJson.tag_name})`);
                process.exit(0);
              }
              lastError = new Error("penkra.com smoke payload did not match expected content");
            } catch (error) {
              lastError = error;
            }
            await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          console.error("penkra.com did not become healthy before deploy smoke:", lastError);
          process.exit(1);
          NODE
